name: Terraform

on:
  pull_request:
    paths:
      - "infrastructure/**"
      - "policies/**"
      - "policy/**"
  push:
    branches:
      - main
    paths:
      - "infrastructure/**"
      - "policies/**"
      - "policy/**"

permissions:
  contents: read
  # id-token: write # Milestone 5: AWS OIDC for live plan/apply

jobs:
  terraform-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infrastructure

      - name: Validate Terraform
        working-directory: infrastructure/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

      # M8.5 temporary IAM bootstrap root: validation only (no credentials, no plan/apply).
      - name: Validate Terraform (identity-eval-bootstrap)
        working-directory: infrastructure/environments/identity-eval-bootstrap
        run: |
          terraform init -backend=false
          terraform validate

      # Milestone 4: add fixture-based Conftest/Rego tests.
      # Milestone 5: run Conftest against a live Terraform plan.
