name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly baseline scan

permissions:
  contents: read

jobs:
  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: IaC scan with Checkov
        uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085 # master pinned 2026-08-04
        with:
          directory: infrastructure
          config_file: checkov.yml
          quiet: true
          soft_fail: false

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secret scan with TruffleHog
        uses: trufflesecurity/trufflehog@24c98ca20e421a6807518f79c5cdd063400774f2 # main pinned 2026-08-04
        with:
          extra_args: --results=verified,unknown

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Export locked production dependencies
        run: >
          uv export
          --locked
          --no-dev
          --no-emit-local
          --format requirements.txt
          --output-file requirements-audit.txt

      - name: Audit Python dependencies
        run: >
          uvx --from pip-audit==2.10.0
          pip-audit
          --require-hashes
          --requirement requirements-audit.txt
          --progress-spinner off

  gitleaks-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Secret scan with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-container-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build locked container image
        run: docker build --tag aws-secure-rag-platform:${{ github.sha }} .

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aws-secure-rag-platform:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml

  terraform-policy-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify compliant Terraform plan
        run: |
          docker run --rm \
            -v "${PWD}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.68.2@sha256:5fd81e332d7e4bc01daf3ef35371800a9a9720a30c0c37a78de0c5fbe4b6d622 \
            test \
            --policy policy/terraform \
            policy/fixtures/terraform-plan-compliant.json

      - name: Verify noncompliant Terraform plan is rejected
        run: |
          if docker run --rm \
            -v "${PWD}:/project" \
            -w /project \
            openpolicyagent/conftest:v0.68.2@sha256:5fd81e332d7e4bc01daf3ef35371800a9a9720a30c0c37a78de0c5fbe4b6d622 \
            test \
            --policy policy/terraform \
            policy/fixtures/terraform-plan-noncompliant.json
          then
            echo "ERROR: Noncompliant Terraform plan unexpectedly passed."
            exit 1
          else
            echo "Expected result: noncompliant Terraform plan was rejected."
          fi

  sbom-and-build-evidence:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Export locked production dependencies
        run: >
          uv export
          --locked
          --no-dev
          --no-emit-local
          --format requirements.txt
          --output-file requirements-audit.txt

      - name: Generate Python CycloneDX SBOM
        run: >
          uvx --from cyclonedx-bom==4.1.2
          cyclonedx-py
          requirements
          requirements-audit.txt
          -o sbom-python.cdx.json

      - name: Build locked container image
        run: docker build --tag aws-secure-rag-platform:${{ github.sha }} .

      - name: Generate container CycloneDX SBOM with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aws-secure-rag-platform:${{ github.sha }}
          format: cyclonedx
          output: sbom-container.cdx.json

      - name: Validate CycloneDX SBOMs
        run: |
          python - <<'PY'
          import json
          for path in ("sbom-python.cdx.json", "sbom-container.cdx.json"):
              with open(path, encoding="utf-8") as f:
                  data = json.load(f)
              assert data.get("bomFormat") == "CycloneDX", f"Invalid format in {path}"
              spec_version = data.get("specVersion")
              components = data.get("components", [])
              assert spec_version in ("1.4", "1.5", "1.6"), (
                  f"Invalid specVersion in {path}"
              )
              assert len(components) > 0, f"No components found in {path}"
              print(
                  f"Validated {path}: CycloneDX {spec_version} "
                  f"with {len(components)} components"
              )
          PY

      - name: Archive image and preserve build evidence
        run: |
          mkdir -p artifacts
          docker save aws-secure-rag-platform:${{ github.sha }} \
            | gzip > artifacts/aws-secure-rag-platform-${{ github.sha }}.tar.gz
          cp sbom-python.cdx.json sbom-container.cdx.json artifacts/

          cd artifacts

          sha256sum \
            aws-secure-rag-platform-${{ github.sha }}.tar.gz \
            > aws-secure-rag-platform-${{ github.sha }}.tar.gz.sha256
          sha256sum \
            sbom-python.cdx.json \
            sbom-container.cdx.json \
            > sboms.sha256

          cat <<EOF > build-metadata.json
          {
            "schemaVersion": "1.0",
            "git": {
              "commit": "${{ github.sha }}",
              "ref": "${{ github.ref }}",
              "repository": "${{ github.repository }}"
            },
            "build": {
              "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
              "runner": {
                "os": "${{ runner.os }}",
                "arch": "${{ runner.arch }}"
              },
              "imageTag": "aws-secure-rag-platform:${{ github.sha }}"
            },
            "artifacts": {
              "imageArchive": "aws-secure-rag-platform-${{ github.sha }}.tar.gz",
              "pythonSbom": "sbom-python.cdx.json",
              "containerSbom": "sbom-container.cdx.json"
            }
          }
          EOF

      - name: Verify generated checksums
        run: |
          cd artifacts
          sha256sum -c aws-secure-rag-platform-${{ github.sha }}.tar.gz.sha256
          sha256sum -c sboms.sha256

      - name: Publish SBOM and build evidence artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: m4-supply-chain-artifacts-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error

  # Milestone 5:
  # Cosign signing, ECR attachment/verification, live Bedrock,
  # latency, and model-graded evaluations.
