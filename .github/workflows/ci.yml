name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Lint with Ruff
        run: uv run ruff check app scripts

      - name: Type check with MyPy
        run: uv run mypy app

      - name: Run unit tests
        run: uv run pytest app/tests -q

      - name: Run offline AI evaluation gates
        run: uv run python scripts/run_evaluations.py

  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Initialize schema and provision runtime role
        env:
          ADMIN_DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
          DATABASE_URL: postgresql://rag_app:rag_app@localhost:5432/rag
          EMBEDDING_DIMENSIONS: "4"
        run: uv run python scripts/initialize_database.py

      - name: Run PostgreSQL row-level security tests
        env:
          TEST_ADMIN_DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
          TEST_DATABASE_URL: postgresql://rag_app:rag_app@localhost:5432/rag
          EMBEDDING_DIMENSIONS: "4"
        run: uv run pytest app/tests/test_rls_integration.py -v