global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "otel-collector"
    scrape_interval: 10s
    static_configs:
      - targets: ["otel-collector:8889"]
    metric_relabel_configs:
      - regex: "(service_instance_id|service.instance.id)"
        action: labeldrop
