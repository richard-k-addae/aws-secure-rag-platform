vulnerabilities:
  - id: CVE-2025-69720
    expired_at: 2026-12-04
    statement: "Packages: libncursesw6, libtinfo6, ncurses-base, ncurses-bin. No fixed Debian 13 package is currently available. Local buffer overflow that needs a user to process crafted terminal data; the container runs one non-interactive service with no terminal sessions. Depends on: non-root user (limits impact if reached)."

  - id: CVE-2026-16742
    expired_at: 2026-12-04
    statement: "Packages: libsystemd0, libudev1. No fixed Debian 13 package is currently available. The flaw is in the systemd-homed service, which is not installed or running in the image; only the shared libraries are present. Does not depend on a runtime mitigation."

  - id: CVE-2026-54369
    expired_at: 2026-12-04
    statement: "Packages: libacl1. No fixed Debian 13 package is currently available. Local symlink-traversal privilege escalation that needs a privileged process using libacl on attacker-controlled paths; no such process runs in the container. Depends on: non-root user, read-only root filesystem, no privileged mode."

  - id: CVE-2026-76642
    expired_at: 2026-12-04
    statement: "Packages: util-linux, mount, login, bsdutils, libmount1, libblkid1, libsmartcols1, libuuid1, liblastlog2-2. No fixed Debian 13 package is currently available. Flaw in privileged mount post-hooks; mounting needs CAP_SYS_ADMIN, which the task will not have. Depends on: Linux capabilities dropped, no privileged mode, non-root user."

  - id: CVE-2026-78408
    expired_at: 2026-12-04
    statement: "Packages: util-linux, mount, login, bsdutils, libmount1, libblkid1, libsmartcols1, libuuid1, liblastlog2-2. No fixed Debian 13 package is currently available. Flaw in nsenter --join-cgroup, which needs privileges to enter namespaces that the task will not have; the application never runs nsenter. Depends on: Linux capabilities dropped, no privileged mode, non-root user."

  - id: CVE-2026-78409
    expired_at: 2026-12-04
    statement: "Packages: util-linux, mount, login, bsdutils, libmount1, libblkid1, libsmartcols1, libuuid1, liblastlog2-2. No fixed Debian 13 package is currently available. Flaw in the X-mount.subdir mount option; mounting needs CAP_SYS_ADMIN, which the task will not have. Depends on: Linux capabilities dropped, no privileged mode, non-root user."

  - id: CVE-2026-78410
    expired_at: 2026-12-04
    statement: "Packages: util-linux, mount, login, bsdutils, libmount1, libblkid1, libsmartcols1, libuuid1, liblastlog2-2. No fixed Debian 13 package is currently available. Flaw in restricted bind mounts; mounting needs CAP_SYS_ADMIN, which the task will not have. Depends on: Linux capabilities dropped, no privileged mode, non-root user."

  - id: CVE-2026-9538
    expired_at: 2026-12-04
    statement: "Packages: perl-base. Debian 13 marks the fix as deferred; no fixed package is currently available. Denial of service when Perl's Archive::Tar parses a crafted archive; the application is Python and never invokes Perl. Does not depend on a runtime mitigation."

  - id: CVE-2026-119373
    expired_at: 2026-12-04
    statement: "Packages: libsqlite3-0. No fixed Debian 13 (Trixie) package is currently available. Heap buffer overflow in SQLite FTS5 prefix merging (detail=none tables). The package is inherited from the python:3.11-slim-trixie base image; the application does not intentionally use SQLite or FTS5. Reachability is assessed as low, not impossible; this is not a mitigation. Temporary exception pending an upstream/Debian fixed package."

  - id: CVE-2026-76844
    expired_at: 2026-12-04
    statement: "Packages: zlib1g (source zlib 1:1.3.dfsg+really1.3.1-1+b1). Real zlib defect (heap buffer overflow in gz_write after a failed write(); NVD, Debian tracker). Debian marks trixie vulnerable; fixed only in unstable (1:1.3.dfsg+really1.3.2-4); no fixed Debian 13 package after a package refresh (checked 2026-11-05). Trivy shows a webpack-dev-middleware title because GHSA-g84c-rxfj-3j2c is mis-aliased to this CVE; the zlib1g match itself is correct. Reachability assessed as low, not impossible: the vulnerable gzFile write API (gzwrite/gzfwrite/gzputs/gzputc/gzprintf) is referenced in the image only by dpkg-deb and libapt-pkg (and defined in libz); the Python interpreter, its zlib module (deflate/inflate stream API only) and all application wheels do not reference it, and the application starts no subprocesses. Depends on: the application not adding gzFile writes or native extensions that use them, and package-management tools never running at runtime (non-root user). Exception is not mitigation; remove when Debian 13 ships a fixed zlib."
